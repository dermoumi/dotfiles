---
- name: Ensure parent directories exist
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "{{ item.dir_mode | default('0755') }}"
  loop: "{{ dotfile_links }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Link dotfiles
  ansible.builtin.file:
    src: "{{ dotfiles_root }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true                     # replaces an existing file/symlink (not a real dir)
  loop: "{{ dotfile_links }}"
  loop_control:
    label: "{{ item.dest }}"
