---
- name: Restart docker service (Linux)
  become: true
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when: ansible_facts.os_family != 'Darwin' and (_docker_check.rc | default(1)) == 0
  listen: Restart docker

- name: Remind to restart Docker Desktop (macOS)
  ansible.builtin.debug:
    msg: "daemon.json updated — restart Docker Desktop for it to take effect."
  when: ansible_facts.os_family == 'Darwin'
  listen: Restart docker
