---
- name: Install the docker engine (Linux)
  when: docker_install
  become: true
  block:
    - name: Ensure the apt keyring directory exists (Debian)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_facts.os_family == 'Debian'

    - name: Install Docker's apt signing key (Debian)
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_apt_distro }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_facts.os_family == 'Debian'

    - name: Add Docker's apt repository (Debian)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ docker_apt_distro }}"
        suites: ["{{ ansible_facts.distribution_release }}"]
        components: [stable]
        architectures: ["{{ docker_apt_arch }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true
      when: ansible_facts.os_family == 'Debian'

    - name: Install docker packages (Debian)
      ansible.builtin.apt:
        name: "{{ docker_apt_packages }}"
        state: present
        update_cache: true
      when: ansible_facts.os_family == 'Debian'

    - name: Install docker packages (Arch)
      ansible.builtin.package:
        name: "{{ docker_pacman_packages }}"
        state: present
      when: ansible_facts.os_family == 'Archlinux'

    - name: Enable the docker service
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    # Takes effect on the next login, not this run.
    - name: Add the user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        groups: docker
        append: true

- name: Check whether docker is installed
  ansible.builtin.command: docker --version
  register: _docker_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure the docker config directory exists
  become: "{{ docker_needs_root }}"
  ansible.builtin.file:
    path: "{{ docker_daemon_json | dirname }}"
    state: directory
    mode: "0755"

- name: Read existing daemon.json
  become: "{{ docker_needs_root }}"
  ansible.builtin.slurp:
    src: "{{ docker_daemon_json }}"
  register: _daemon_raw
  failed_when: false

- name: Write merged daemon.json
  become: "{{ docker_needs_root }}"
  ansible.builtin.copy:
    dest: "{{ docker_daemon_json }}"
    content: "{{ existing | combine(docker_daemon_config) | to_nice_json }}\n"
    mode: "0644"
  vars:
    existing: >-
      {{ (_daemon_raw.content | b64decode | from_json)
         if (_daemon_raw.content is defined
             and (_daemon_raw.content | b64decode | trim | length > 0))
         else {} }}
  notify: Restart docker
