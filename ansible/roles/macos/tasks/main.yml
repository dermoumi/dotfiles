---
- name: Configure macOS system defaults
  when: ansible_facts.os_family == 'Darwin'
  block:
    - name: Set keyboard repeat rates
      # float matches how macOS/System Settings stores these, so no type clash.
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: "{{ item.key }}"
        type: float
        value: "{{ item.value }}"
      loop: "{{ macos_repeat_keys }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Disable press-and-hold for specific apps
      community.general.osx_defaults:
        domain: "{{ item }}"
        key: ApplePressAndHoldEnabled
        type: bool
        value: false
      loop: "{{ macos_press_and_hold_disabled }}"

    # Move any window with ctrl+cmd+drag (needed with hidden titlebars).
    - name: Enable drag-to-move anywhere
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: NSWindowShouldDragOnGesture
        type: bool
        value: true

    - name: Ensure LaunchAgents directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents"
        state: directory
        mode: "0755"

    - name: Install the session-env LaunchAgent
      ansible.builtin.template:
        src: session-env.plist.j2
        dest: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ macos_session_env_label }}.plist"
        mode: "0644"
      notify: Reload session-env launch agent
