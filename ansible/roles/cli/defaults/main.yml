---
# Cross-platform standalone binaries — installed on every variant.
mise_tools:
  fzf: latest
  fd: latest
  ripgrep: latest
  bat: latest
  zoxide: latest
  neovim: latest
  # eza is a native package below — it has no prebuilt binary mise can fetch on
  # macOS arm64 (aqua=cargo type, no GitHub release asset).

# Extra mise tools per variant (server and devcontainer get none).
mise_variant_tools:
  workstation:
    node: lts
    pnpm: latest
    kubectl: latest
    argocd: latest
    aws-cli: latest
    opentofu: latest
    sops: latest
  server:
    node: lts

# Effective set rendered into config.toml.
mise_all_tools: "{{ mise_tools | combine(mise_variant_tools[variant] | default({})) }}"

# Tools with real system integration stay on the native package manager.
cli_native_packages: # Linux, every variant
  - zsh
  - git
  - curl
  - unzip
  - gnupg
  - tmux
  - eza
  - socat
cli_native_variant_packages: {} # Linux, per variant
cli_native_all_packages: "{{ cli_native_packages + (cli_native_variant_packages[variant] | default([])) }}"
cli_brew_packages: # macOS
  - gnupg
  - tmux
  - eza
  - socat
  - zsh

mise_bin: "{{ ansible_facts.env.HOME }}/.local/bin/mise"
