---
# Cross-platform standalone binaries — installed on every variant.
mise_tools:
  fzf: latest
  fd: latest
  ripgrep: latest
  bat: latest
  zoxide: latest
  neovim: latest
  # eza is a native package below — it has no prebuilt binary mise can fetch on
  # macOS arm64 (aqua=cargo type, no GitHub release asset).

# Language toolchains, added to the same mise config per variant. Keeping them
# here (rather than a separate role) means one role owns config.toml, so nothing
# clobbers it. Servers get none. No variant installs a standalone python — uv
# self-provisions an isolated python per venv (incl. the neovim provider), so
# workstations add node/pnpm and containers add nothing else.
mise_runtime_tools:
  workstation:
    node: lts
    pnpm: latest
    uv: latest
  devcontainer:
    uv: latest

# Effective set rendered into config.toml.
mise_all_tools: "{{ mise_tools | combine(mise_runtime_tools[variant] | default({})) }}"

# Tools with real system integration stay on the native package manager.
cli_native_packages: # Linux
  - zsh
  - git
  - curl
  - unzip
  - gnupg
  - tmux
  - eza
cli_brew_packages: # macOS
  - gnupg
  - tmux
  - eza

mise_bin: "{{ ansible_facts.env.HOME }}/.local/bin/mise"
