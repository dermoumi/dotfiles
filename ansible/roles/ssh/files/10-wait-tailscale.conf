# Managed by Ansible (roles/ssh). Wait for the tailscale0 IPv4 before sshd
# binds ListenAddress at boot. $$ is systemd-escaped so bash receives $.
[Unit]
After=tailscaled.service network-online.target
Wants=network-online.target

[Service]
ExecStartPre=/usr/bin/bash -c 'for i in $$(seq 30); do ip -4 addr show tailscale0 2>/dev/null | grep -q "inet " && exit 0; sleep 1; done'
