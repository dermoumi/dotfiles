# Ordered: daemon-reload runs before restart when both are notified.
# become:true per-handler since the play default is now become:false.
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Validate sshd config
  become: true
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Restart sshd

- name: Restart sshd
  become: true
  ansible.builtin.systemd_service:
    name: sshd.service
    state: restarted
