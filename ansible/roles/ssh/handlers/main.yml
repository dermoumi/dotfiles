# Ordered: daemon-reload runs before restart when both are notified.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Restart sshd

- name: Restart sshd
  ansible.builtin.systemd_service:
    name: sshd.service
    state: restarted
