- name: System setup
  hosts: all
  become: false                     # user-space by default; roles opt into become
  vars:
    variant: ""                     # override with -e variant=workstation
  tasks:
    - name: Validate variant
      ansible.builtin.assert:
        that: variant == "" or variant in variant_roles
        fail_msg: >-
          Unknown variant '{{ variant }}'. Choose one of:
          {{ variant_roles.keys() | list | join(', ') }}

    - name: Resolve this machine's roles
      ansible.builtin.set_fact:
        _machine_roles: >-
          {{ (variant_roles[variant] | default([]))
             + (host_extra_roles | default([])) }}

    - name: Require at least one role
      ansible.builtin.assert:
        that: _machine_roles | length > 0
        fail_msg: >-
          No roles selected. Pass a variant (e.g. -e variant=workstation)
          or set host_extra_roles in host_vars/{{ inventory_hostname }}.yml

    - name: Apply this variant's variable overrides
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ variant_vars[variant] | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Apply roles
      ansible.builtin.include_role:
        name: "{{ role_item }}"
      loop: "{{ _machine_roles }}"
      loop_control:
        loop_var: role_item
