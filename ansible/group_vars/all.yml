# Variant → roles. The variant is chosen at invocation time (`./setup.sh
# workstation`) and passed to Ansible as an extra-var, so provisioning a new
# machine needs no inventory/host_vars entry.
#
# OS differences (mac / linux / wsl2) are handled inside each role via
# ansible_os_family — a variant only decides *which* roles run.
variant_roles:
  # Full day-to-day environment (personal machines).
  workstation:
    - dotfiles
    - cli          # CLI binaries + language runtimes (node/pnpm/uv)
    - neovim       # python provider + headless plugin sync
    - desktop      # GUI apps; gated on desktop_enabled (see variant_vars)
    - macos        # system defaults

  # Minimal footprint for remote machines (VPS, homelab).
  server:
    - dotfiles
    - cli
    - neovim

  # Minimal set plus neovim; uv (from the cli role) self-provisions an isolated
  # python for the provider, so no node/pnpm/system-python needed.
  devcontainer:
    - dotfiles
    - cli
    - neovim

# Per-variant variable overrides, applied in site.yml. A host can still override
# any of these in its host_vars (e.g. a WSL2 workstation sets desktop_enabled: false).
variant_vars:
  workstation:
    desktop_enabled: true
