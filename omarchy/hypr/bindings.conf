# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

#
# NAVIGATION
#

# Close windowss
bindd = SUPER, W, Close window, killactive,

# Move focus with mainMod + HJKL
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Move the window
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Resize window
binde = SUPER CTRL, H, resizeactive, -50 0
binde = SUPER CTRL, L, resizeactive, 50 0
binde = SUPER CTRL, K, resizeactive, 0 -50
binde = SUPER CTRL, J, resizeactive, 0 50

binde = SUPER CTRL SHIFT, H, resizeactive, -10 0
binde = SUPER CTRL SHIFT, L, resizeactive, 10 0
binde = SUPER CTRL SHIFT, K, resizeactive, 0 -10
binde = SUPER CTRL SHIFT, J, resizeactive, 0 10

# Tiling
bindd = SUPER, MINUS, Toggle window split, layoutmsg, togglesplit
bindd = SUPER, F, Toggle window floating, togglefloating
bindd = SUPER SHIFT, F, Toggle fullscreen, fullscreen
bindd = SUPER CTRL, F, Toggle full width, fullscreen, 1
bindd = SUPER, P, Floating Pin window, exec, omarchy-hyprland-window-pop

# Groups
bindd = SUPER CTRL, G, Toggle group, togglegroup,
bindd = SUPER, G, Next group window, changegroupactive, f
bindd = SUPER SHIFT, G, Next group window, changegroupactive, b
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup

bind = SUPER ALT, H, moveintogroup, l
bind = SUPER ALT, L, moveintogroup, r
bind = SUPER ALT, K, moveintogroup, u
bind = SUPER ALT, J, moveintogroup, d

# Activate window in a group by number
bindd = SUPER CTRL, code:10, Switch to group window 1, changegroupactive, 1
bindd = SUPER CTRL, code:11, Switch to group window 2, changegroupactive, 2
bindd = SUPER CTRL, code:12, Switch to group window 3, changegroupactive, 3
bindd = SUPER CTRL, code:13, Switch to group window 4, changegroupactive, 4
bindd = SUPER CTRL, code:14, Switch to group window 5, changegroupactive, 5

# Scroll through existing workspaces with mainMod + scroll
bind = CTRL SUPER, right, workspace, r+1
bind = CTRL SUPER, left, workspace, r-1

# Switch workspaces with SUPER + [1-9; 0]
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:18, Switch to workspace 9, workspace, 9
bindd = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9; 0]
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
bindd = SUPER SHIFT CTRL, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT CTRL, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT CTRL, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT CTRL, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT CTRL, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT CTRL, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT CTRL, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT CTRL, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT CTRL, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT CTRL, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

# Control scratchpad
bindd = SUPER, SEMICOLON, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER SHIFT, SEMICOLON, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# Move workspaces to other monitors
bindd = SUPER SHIFT CTRL, H, Move workspace left, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT CTRL, L, Move workspace right, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT CTRL, J, Move workspace down, movecurrentworkspacetomonitor, d
bindd = SUPER SHIFT CTRL, K, Move workspace up, movecurrentworkspacetomonitor, u

# Cycle through applications on active workspace
bindd = SUPER, TAB, Cycle to next window, cyclenext
bindd = SUPER SHIFT, TAB, Cycle to prev window, cyclenext, prev
bindd = SUPER, TAB, Reveal active window on top, bringactivetotop
bindd = SUPER SHIFT, TAB, Reveal active window on top, bringactivetotop

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

#
# APPEARANCE
#

# Toggle dark mode
bindd = SUPER SHIFT, SPACE, Toggle dark mode, exec, ~/.dotfiles/scripts/toggle-theme

# Toggle waybar
bindd = SUPER, F11, Toggle top bar, exec, omarchy-toggle-waybar

# Toggle nightlight
bindd = SUPER CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight

#
# MEDIA
#

# Only display the OSD on the currently focused monitor
$osdclient = swayosd-client --monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, $osdclient --output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, $osdclient --output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, $osdclient --output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, $osdclient --input-volume mute-toggle
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, $osdclient --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, $osdclient --brightness lower
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, $osdclient --brightness raise
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, $osdclient --brightness lower

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $osdclient --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $osdclient --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, $osdclient --brightness +1
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, $osdclient --brightness -1

# Requires playerctl
bindld = , XF86AudioNext, Next track, exec, $osdclient --playerctl next
bindld = , XF86AudioPause, Pause, exec, $osdclient --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, $osdclient --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, $osdclient --playerctl previous

# Switch audio output with Super + Mute, or alternatively, Left Ctrl + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, omarchy-cmd-audio-switch
bind = CTRL_L, XF86AudioMute, exec, omarchy-cmd-audio-switch

# Monitor brightness control
bind = CONTROL_L ALT_L SUPER_L, Prior, exec, ~/.dotfiles/scripts/ddc-control + 20
bind = CONTROL_L ALT_L SUPER_L, Next, exec, ~/.dotfiles/scripts/ddc-control - 20

#
# CLIPBOARD
#
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X,
bindd = SUPER CTRL, V, Clipboard manager, exec, omarchy-launch-walker -m clipboard

#
# UTILITIES
#

# Menus
bindd = SUPER CTRL, E, Emoji picker, exec, omarchy-launch-walker -m symbols
bindd = SUPER ALT, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER, ESCAPE, System menu, exec, omarchy-menu system
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle workspace gaps, exec, omarchy-hyprland-workspace-toggle-gaps

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications"
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggle idling
bindd = SUPER CTRL, I, Toggle locking on idle, exec, omarchy-toggle-idle

# Control Apple Display brightness
bindd = CTRL, F1, Apple Display brightness down, exec, omarchy-cmd-apple-display-brightness -5000
bindd = CTRL, F2, Apple Display brightness up, exec, omarchy-cmd-apple-display-brightness +5000
bindd = SHIFT CTRL, F2, Apple Display full brightness, exec, omarchy-cmd-apple-display-brightness +60000

# Captures
bindd = , PRINT, Screenshot with editing, exec, omarchy-cmd-screenshot
bindd = SUPER SHIFT, S, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = SUPER ALT, S, Screenrecording, exec, omarchy-menu screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# File sharing
bindd = SUPER CTRL, S, Share, exec, omarchy-menu share

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send "    $(date +"%A %H:%M  —  %d %B W%V %Y")"

#
# SHORTCUTS
#

# Utilities
bindd = SUPER, SPACE, Launch apps, exec, omarchy-launch-walker
bindd = SUPER CTRL, SPACE, Launch commands, exec, omarchy-launch-walker
bindd = SUPER, slash, Show key bindings, exec, omarchy-menu-keybindings

# Application bindings
bindd = SUPER, RETURN, Tmux, exec, ~/.dotfiles/scripts/launch-tui ~/.dotfiles/scripts/tmux-attach
bindd = SUPER SHIFT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER CTRL SHIFT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- bitwarden-desktop

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Rebind lock to SUPER ALT L
bindd = SUPER CTRL, COMMA, Lock system, exec, omarchy-lock-screen

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, omarchy-launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, omarchy-launch-bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, omarchy-launch-wifi
bindd = SUPER CTRL, T, Activity, exec, omarchy-launch-tui btop

# Dictation
bindd  = SUPER CTRL, J, Start dictation, exec, voxtype record start
binddr = SUPER CTRL, J, Stop dictation, exec, voxtype record stop

# Background menu
# bindd = SUPER CTRL, SPACE, Theme background menu, exec, omarchy-menu background
