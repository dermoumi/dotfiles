# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

windowrule {
  name = no_maximize
  match:class = .*
  suppress_event = maximize
}

# Tag all windows for default opacity (apps can override with -default-opacity tag)
windowrule {
  name = opacity_tag
  match:class = .*
  tag = +default-opacity
}

# Fix some dragging issues with XWayland
windowrule {
  name = xwayland_fix
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
  no_focus = on
}

# App-specific tweaks (may remove default-opacity tag)
source = ~/.dotfiles/omarchy/hypr/apps/bitwarden.conf
source = ~/.dotfiles/omarchy/hypr/apps/browser.conf
source = ~/.dotfiles/omarchy/hypr/apps/hyprshot.conf
source = ~/.dotfiles/omarchy/hypr/apps/jetbrains.conf
source = ~/.dotfiles/omarchy/hypr/apps/localsend.conf
source = ~/.dotfiles/omarchy/hypr/apps/pip.conf
source = ~/.dotfiles/omarchy/hypr/apps/qemu.conf
source = ~/.dotfiles/omarchy/hypr/apps/retroarch.conf
source = ~/.dotfiles/omarchy/hypr/apps/steam.conf
source = ~/.dotfiles/omarchy/hypr/apps/geforce.conf
source = ~/.dotfiles/omarchy/hypr/apps/telegram.conf
source = ~/.dotfiles/omarchy/hypr/apps/walker.conf
source = ~/.dotfiles/omarchy/hypr/apps/webcam-overlay.conf
source = ~/.dotfiles/omarchy/hypr/apps/windscribe.conf
source = ~/.dotfiles/omarchy/hypr/apps/terminals.conf
source = ~/.dotfiles/omarchy/hypr/apps/system.conf

# Apply default opacity after apps have had a chance to opt out
windowrule {
  name = opacity
  match:tag = default-opacity
  opacity = 1 0.9
}

windowrule {
  name = tray_windows
  match:tag = tray-window
  float = true
  no_initial_focus = true
  size = 875 600
  move = monitor_w-875-10 36
}
